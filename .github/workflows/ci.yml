name: Integración continua

on:
  pull_request:
  workflow_call:

permissions:
  contents: read

env:
  TERRAFORM_VERSION: 1.17.1

jobs:
  app:
    name: Pruebas de la aplicación
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    env:
      PYTHONPATH: src
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Instalar dependencias
        run: python -m pip install -r requirements-dev.txt
      - name: Ejecutar pytest
        run: python -m pytest -q

  terraform:
    name: Terraform
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TERRAFORM_VERSION }}
          terraform_wrapper: false
      - name: Formato
        run: terraform fmt -check -recursive infra
      - name: Validar cada raiz
        run: |
          for root in infra/bootstrap infra/environments/shared infra/environments/dev infra/environments/prod; do
            terraform -chdir="$root" init -backend=false -lockfile=readonly -input=false
            terraform -chdir="$root" validate
          done
      - name: Pruebas con proveedores simulados
        run: |
          for module in infra/modules/database infra/modules/stack; do
            terraform -chdir="$module" init -backend=false -lockfile=readonly -input=false
            terraform -chdir="$module" test
          done

