name: Despliegue en Azure

on:
  push:
    branches: [develop]
    paths:
      - "app/**"
      - "infra/**"
      - "scripts/**"
      - ".github/workflows/**"
  workflow_dispatch:
    inputs:
      digest:
        description: Digest de una imagen anterior para rollback. Si se omite, se construye una nueva.
        required: false
        type: string

permissions:
  contents: read

# Un despliegue a la vez: el siguiente espera a que termine el anterior.
concurrency: deploy

jobs:
  ci:
    name: Pruebas
    uses: ./.github/workflows/ci.yml

  image:
    name: Imagen
    needs: ci
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      ref: ${{ steps.ref.outputs.ref }}
    steps:
      - uses: actions/checkout@v4
      - name: Calcular el nombre de la imagen
        id: name
        env:
          REPOSITORY: ${{ github.repository }}
        run: echo "image=ghcr.io/${REPOSITORY,,}" >> "$GITHUB_OUTPUT"
      - name: Validar el digest de rollback
        if: inputs.digest != ''
        env:
          DIGEST: ${{ inputs.digest }}
        run: |
          if ! [[ "$DIGEST" =~ ^sha256:[a-f0-9]{64}$ ]]; then
            echo "::error::El digest debe tener el formato sha256:<64 caracteres hexadecimales>"
            exit 1
          fi
      - uses: docker/login-action@v3
        if: inputs.digest == ''
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/setup-buildx-action@v3
        if: inputs.digest == ''
      - name: Construir y publicar
        id: build
        if: inputs.digest == ''
        uses: docker/build-push-action@v6
        with:
          context: app
          platforms: linux/amd64
          push: true
          tags: ${{ steps.name.outputs.image }}:${{ github.sha }}
          # Vincula el paquete con este repositorio, para que GITHUB_TOKEN pueda volver a publicarlo.
          labels: org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
      - name: Fijar la imagen por digest
        id: ref
        env:
          IMAGE: ${{ steps.name.outputs.image }}
          DIGEST: ${{ inputs.digest || steps.build.outputs.digest }}
        run: |
          echo "ref=$IMAGE@$DIGEST" >> "$GITHUB_OUTPUT"
          {
            echo "### Imagen desplegada"
            echo
            echo "\`$IMAGE@$DIGEST\`"
            echo
            echo "Guarde este digest: es el valor que pide el rollback."
          } >> "$GITHUB_STEP_SUMMARY"

  shared:
    name: Plataforma compartida
    needs: image
    permissions:
      contents: read
      id-token: write
    uses: ./.github/workflows/terraform-apply.yml
    with:
      root: shared
      environment: dev

  dev:
    name: Desplegar dev
    needs: [image, shared]
    permissions:
      contents: read
      id-token: write
    uses: ./.github/workflows/terraform-apply.yml
    secrets:
      OWNER_PASSWORD: ${{ secrets.OWNER_PASSWORD }}
    with:
      root: dev
      environment: dev
      image: ${{ needs.image.outputs.ref }}
      smoke: true

